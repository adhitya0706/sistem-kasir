<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pancong Lumer Kenangan - POS & Cloud System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase App & Realtime Database CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Toast / Alert Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="app" class="min-h-screen flex flex-col"></div>

    <script>
        // ==========================================
        // KONFIGURASI FIREBASE RESMI ANDA
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA-JsTYJ3rZiYOCg9ZxuPFnfMJxfNTe80Y",
            authDomain: "sistem-kasir-c9b40.firebaseapp.com",
            databaseURL: "https://sistem-kasir-c9b40-default-rtdb.firebaseio.com",
            projectId: "sistem-kasir-c9b40",
            storageBucket: "sistem-kasir-c9b40.firebasestorage.app",
            messagingSenderId: "252030982454",
            appId: "1:252030982454:web:ae42d7cfd0d23beadabb97",
            measurementId: "G-G12887MBD6"
        };

        // Inisialisasi Firebase Realtime Database
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // Database Default jika kosong
        const defaultDB = {
            currentUser: null,
            currentShift: { employeeName: "", outletName: "", startTime: null },
            outlets: ["Outlet Sidoagung", "Outlet Central", "Outlet Margonda", "Outlet Tebet"],
            users: [
                { username: "admin", pin: "1234", name: "Admin Utama", role: "admin" },
                { username: "karyawan", pin: "5678", name: "Aditya", role: "karyawan" }
            ],
            rawMaterials: [
                { id: "rm1", name: "Adonan 250gr", category: "Bahan Utama & Adonan", stock: 4, unit: "bks" },
                { id: "rm2", name: "Telur Ayam", category: "Bahan Utama & Adonan", stock: 4, unit: "butir" },
                { id: "rm3", name: "Choco Crunchy", category: "Variasi Topping & Glaze", stock: 369, unit: "gr" },
                { id: "rm4", name: "Cheese Crunchy", category: "Variasi Topping & Glaze", stock: 464, unit: "gr" },
                { id: "rm5", name: "Glaze Cokelat", category: "Variasi Topping & Glaze", stock: 392, unit: "gr" },
                { id: "rm6", name: "Glaze Tiramisu", category: "Variasi Topping & Glaze", stock: 659, unit: "gr" },
                { id: "rm7", name: "Box Logo", category: "Kemasan & Dus", stock: 23, unit: "pcs" }
            ],
            products: [
                { id: "p1", name: "ORSS (Original Susu)", price: 8000, stock: 20, category: "Original", topping: "Susu" },
                { id: "p2", name: "KJSS (Keju Susu)", price: 11000, stock: 15, category: "Special", topping: "Keju Parut + SKM" },
                { id: "p3", name: "C (Cokelat)", price: 10000, stock: 12, category: "Coklat", topping: "Glaze Cokelat" }
            ],
            cart: [],
            transactions: [],
            submittedShiftReports: [],
            activeTab: "pos",
            selectedOutletFilter: "All"
        };

        // Mengambil data dari Firebase Realtime Database
        let globalDB = JSON.parse(JSON.stringify(defaultDB));

        function fetchDBFromCloud(callback) {
            database.ref("pancong_db").once("value").then((snapshot) => {
                const val = snapshot.val();
                if (val) {
                    globalDB = val;
                } else {
                    database.ref("pancong_db").set(defaultDB);
                    globalDB = JSON.parse(JSON.stringify(defaultDB));
                }
                if (callback) callback(globalDB);
            }).catch((err) => {
                console.error("Gagal memuat database:", err);
                if (callback) callback(globalDB);
            });
        }

        function saveDBToCloud(data, callback) {
            globalDB = data;
            database.ref("pancong_db").set(data).then(() => {
                if (callback) callback();
            }).catch((err) => {
                console.error("Gagal menyimpan ke database:", err);
            });
        }

        function showAlert(title, message, type = "info") {
            const container = document.getElementById("toast-container");
            if (!container) return;
            const toast = document.createElement("div");
            const bgClass = type === "error" ? "bg-rose-600 text-white" : type === "success" ? "bg-emerald-600 text-white" : "bg-blue-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-xmark' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} text-lg"></i>
                <div>
                    <h4 class="font-bold text-xs uppercase tracking-wider">${title}</h4>
                    <p class="text-xs font-medium opacity-90">${message}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function renderLoginView() {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl border border-blue-100 p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg ring-4 ring-blue-100">
                                <i class="fa-solid fa-stroopwafel"></i>
                            </div>
                            <h1 class="text-2xl font-black text-blue-900 uppercase tracking-wide">PANCONG <span class="text-blue-600">LUMER</span></h1>
                            <p class="text-xs text-slate-500 font-semibold mt-1">Sistem POS & Laporan Shift (Cloud DB)</p>
                        </div>

                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Username</label>
                                <input type="text" id="login-username" required placeholder="admin / karyawan" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">PIN Akses (4 Digit)</label>
                                <input type="password" id="login-pin" maxlength="4" required placeholder="1234 / 5678" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                            </div>

                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                                <span>MASUK KE SISTEM</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>

                        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500 space-y-1 bg-slate-50 p-3 rounded-2xl">
                            <p><strong class="text-blue-900">Akun Demo:</strong> Admin (<code class="bg-blue-100 text-blue-800 px-1 rounded font-bold">admin</code> / <code class="bg-blue-100 text-blue-800 px-1 rounded font-bold">1234</code>) | Karyawan (<code class="bg-blue-100 text-blue-800 px-1 rounded font-bold">karyawan</code> / <code class="bg-blue-100 text-blue-800 px-1 rounded font-bold">5678</code>)</p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById("login-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const username = document.getElementById("login-username").value.trim();
                const pin = document.getElementById("login-pin").value.trim();

                fetchDBFromCloud((db) => {
                    const user = db.users.find(u => u.username === username && u.pin === pin);
                    if (user) {
                        db.currentUser = user;
                        saveDBToCloud(db, () => {
                            renderApp();
                        });
                    } else {
                        showAlert("Login Gagal", "Username atau PIN salah.", "error");
                    }
                });
            });
        }

        function renderShiftModal(db) {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl border border-blue-100 p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3">
                                <i class="fa-solid fa-id-card-clip"></i>
                            </div>
                            <h2 class="text-xl font-black text-blue-950 uppercase">Presensi Shift Karyawan</h2>
                            <p class="text-xs text-slate-500 mt-1">Masukkan nama & pilih outlet jaga hari ini</p>
                        </div>
                        <form id="shift-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Nama Karyawan</label>
                                <input type="text" id="shift-emp-name" required placeholder="Nama Lengkap" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Outlet Pancong</label>
                                <select id="shift-outlet-name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                                    ${db.outlets.map(o => `<option value="${o}">${o}</option>`).join('')}
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition text-sm">
                                Mulai Shift Kerja
                            </button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById("shift-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const empName = document.getElementById("shift-emp-name").value.trim();
                const outlet = document.getElementById("shift-outlet-name").value;
                if (!empName) return showAlert("Wajib Diisi", "Masukkan nama karyawan.", "error");

                db.currentShift = { employeeName: empName, outletName: outlet, startTime: new Date().toISOString() };
                saveDBToCloud(db, () => renderApp());
            });
        }

        function renderApp() {
            fetchDBFromCloud((db) => {
                const appEl = document.getElementById("app");
                if (!db.currentUser) {
                    renderLoginView();
                    return;
                }
                if (db.currentUser.role === 'karyawan' && !db.currentShift.employeeName) {
                    renderShiftModal(db);
                    return;
                }
                if (db.currentUser.role === 'admin' && db.activeTab === 'pos') {
                    db.activeTab = 'admin_monitor';
                    saveDBToCloud(db);
                }

                appEl.innerHTML = `
                    <header class="bg-blue-900 text-white sticky top-0 z-30 shadow-md">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-white text-blue-900 rounded-xl flex items-center justify-center font-bold shadow-md">
                                    <i class="fa-solid fa-stroopwafel text-blue-600 text-xl"></i>
                                </div>
                                <div>
                                    <h1 class="font-black text-white text-base leading-tight uppercase tracking-wider">PANCONG <span class="text-blue-300">LUMER</span></h1>
                                    <p class="text-[11px] text-blue-200 font-semibold">
                                        <span>${db.currentUser.role === 'karyawan' ? `Outlet: ${db.currentShift.outletName}` : 'Pusat Kontrol Admin'}</span>
                                    </p>
                                </div>
                            </div>

                            <div class="flex items-center space-x-3">
                                <div class="text-right hidden sm:block">
                                    <p class="text-xs font-bold text-white">${db.currentUser.role === 'karyawan' ? db.currentShift.employeeName : db.currentUser.name}</p>
                                    <span class="text-[10px] uppercase font-black px-2 py-0.5 bg-blue-800 text-blue-200 rounded-full">${db.currentUser.role === 'karyawan' ? 'Staff' : 'Admin'}</span>
                                </div>
                                <button onclick="logoutApp()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">
                                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                                </button>
                            </div>
                        </div>
                    </header>

                    <nav class="bg-white border-b border-slate-200 shadow-xs">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-2 overflow-x-auto py-2.5">
                            ${db.currentUser.role === 'karyawan' ? `
                                <button onclick="switchTab('pos')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'pos' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">Kasir POS</button>
                            ` : ''}
                            ${db.currentUser.role === 'admin' ? `
                                <button onclick="switchTab('admin_monitor')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'admin_monitor' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">Pantau Laporan Shift Karyawan</button>
                            ` : ''}
                            <button onclick="switchTab('stock')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'stock' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">Rekap Stok</button>
                            <button onclick="switchTab('sales')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'sales' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">Penjualan Hari Ini</button>
                        </div>
                    </nav>

                    <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8"></main>
                `;
                renderActiveTabContent(db);
            });
        }

        function logoutApp() {
            fetchDBFromCloud((db) => {
                db.currentUser = null;
                db.currentShift = { employeeName: "", outletName: "", startTime: null };
                saveDBToCloud(db, () => renderLoginView());
            });
        }

        function switchTab(tabName) {
            fetchDBFromCloud((db) => {
                db.activeTab = tabName;
                saveDBToCloud(db, () => renderApp());
            });
        }

        function renderActiveTabContent(db) {
            const mainEl = document.getElementById("main-content");
            if (!mainEl) return;

            if (db.activeTab === "pos" && db.currentUser.role === 'karyawan') {
                mainEl.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-xs">
                        <h3 class="font-black text-lg text-blue-900 uppercase mb-2"><i class="fa-solid fa-cash-register mr-2"></i>Halaman Kasir POS</h3>
                        <p class="text-xs text-slate-500 font-semibold">Sistem POS Siap Digunakan untuk Outlet ${db.currentShift.outletName}.</p>
                    </div>
                `;
            } else if (db.activeTab === "admin_monitor" && db.currentUser.role === 'admin') {
                mainEl.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-blue-900 text-white p-6 rounded-3xl shadow-md">
                            <h2 class="font-black text-xl uppercase">Pusat Pantauan Laporan Shift Karyawan</h2>
                            <p class="text-xs text-blue-200 mt-1">Laporan dari staf outlet akan masuk secara real-time di sini.</p>
                        </div>
                        <div class="bg-white rounded-3xl p-6 shadow-xs border border-slate-200">
                            <h3 class="font-bold text-sm mb-4">Daftar Laporan Shift Masuk (${db.submittedShiftReports.length})</h3>
                            ${db.submittedShiftReports.length === 0 ? '<p class="text-xs text-slate-400">Belum ada laporan shift yang dikirim karyawan.</p>' : 
                                db.submittedShiftReports.map(r => `
                                    <div class="p-4 bg-slate-50 rounded-2xl border mb-3 flex justify-between items-center text-xs">
                                        <div>
                                            <p class="font-bold text-blue-900">${r.employeeName} -${r.outletName}</p>
                                            <p class="text-slate-500">${r.date} \vert{} Omzet: Rp${(r.keuangan?.omzetTotal || 0).toLocaleString('id-ID')}</p>
                                        </div>
                                        <span class="px-2 py-1 bg-emerald-100 text-emerald-800 font-bold rounded">${r.status}</span>
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                `;
            } else {
                mainEl.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-xs">Fitur aktif untuk tab: ${db.activeTab}</div>`;
            }
        }

        window.onload = function() {
            renderLoginView();
        };
    </script>
</body>
</html>
