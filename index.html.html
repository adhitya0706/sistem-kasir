                { id: "p7", name: "GT (Green Tea)", price: 10000, stock: 5, category: "Premium", topping: "Green Tea" },
                { id: "p8", name: "DUR (Durian)", price: 10000, stock: 10, category: "Premium", topping: "Durian" },

                { id: "p10", name: "BB (Blueberry)", price: 10000, stock: 10, category: "Fruit", topping: "Blueberry" }
            ],
            cart: [],
            transactions: [],
            submittedShiftReports: [
                {
                    id: "REP-982104",
                    date: "18 Oktober 2026",
                    outletName: "Outlet Sidoagung",
                    employeeName: "Aditya",
                    status: "menunggu",
                    absensi: { buka: "16:30", tutup: "23:30" },
                    keuangan: { omzetTotal: 316000, tunai: 126000, qris: 108000, online: 82000, pengeluaran: 75000, pengeluaranNote: "Lampu Bohlam", setorTunai: 51000, bonusPegawai: 5000 },
                    penjualanPancong: { adonanDibuat: 6, porsiTerjual: 27, porsiGratis: 0, porsiSisa: 3, porsiTotalDibuat: 30 }
                }
            ],
            activeTab: "pos",
            selectedOutletFilter: "All"
        };

        function getDB() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultDB));
                return defaultDB;
            }
            try {
                const parsed = JSON.parse(saved);
                if (!parsed.submittedShiftReports) parsed.submittedShiftReports = defaultDB.submittedShiftReports;
                if (!parsed.transactions) parsed.transactions = [];
                return parsed;
            } catch (e) {
                return defaultDB;
            }
        }

        function saveDB(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            renderApp();
        }

        function showAlert(title, message, type = "info") {
            const container = document.getElementById("toast-container");
            if (!container) return;

            const toast = document.createElement("div");
            const bgClass = type === "error" ? "bg-rose-600 text-white" : type === "success" ? "bg-emerald-600 text-white" : "bg-blue-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 transition-all duration-300 pointer-events-auto transform translate-y-0`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-xmark' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} text-lg"></i>
                <div>
                    <h4 class="font-bold text-xs uppercase tracking-wider">${title}</h4>
                    <p class="text-xs font-medium opacity-90">${message}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function renderLoginView(db) {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl border border-blue-100 p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg ring-4 ring-blue-100">
                                <i class="fa-solid fa-stroopwafel"></i>
                            </div>
                            <h1 class="text-2xl font-black text-blue-900 uppercase tracking-wide">PANCONG <span class="text-blue-600">LUMER</span></h1>
                            <p class="text-xs text-slate-500 font-semibold mt-1">Sistem POS Kasir & Laporan Shift</p>
                        </div>

                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Username</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" id="login-username" required placeholder="admin / karyawan" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900 font-semibold">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">PIN Akses (4 Digit)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="login-pin" maxlength="4" required placeholder="1234 / 5678" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900 font-semibold">
                                </div>
                            </div>

                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                                <span>MASUK KE SISTEM</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>

                        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500 space-y-1 bg-slate-50 p-3 rounded-2xl">
                            <p><strong class="text-blue-900">Akun Demo Default:</strong></p>
                            <p>Admin: <code class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">admin</code> | PIN <code class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">1234</code></p>
                            <p>Karyawan: <code class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">karyawan</code> | PIN <code class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">5678</code></p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById("login-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const username = document.getElementById("login-username").value.trim();
                const pin = document.getElementById("login-pin").value.trim();

                const user = db.users.find(u => u.username === username && u.pin === pin);
                if (user) {
                    db.currentUser = user;
                    saveDB(db);
                } else {
                    showAlert("Login Gagal", "Username atau PIN salah.", "error");
                }
            });
        }

        function renderShiftModal(db) {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl border border-blue-100 p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3 shadow-sm">
                                <i class="fa-solid fa-id-card-clip"></i>
                            </div>
                            <h2 class="text-xl font-black text-blue-950 uppercase">Presensi Shift Karyawan</h2>
                            <p class="text-xs text-slate-500 mt-1">Masukkan nama & pilih outlet jaga hari ini</p>
                        </div>
                        <form id="shift-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Nama Karyawan</label>
                                <input type="text" id="shift-emp-name" required placeholder="Masukkan Nama Lengkap" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Outlet Pancong</label>
                                <select id="shift-outlet-name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">

                                </select>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                                <i class="fa-solid fa-circle-check"></i>
                                <span>Mulai Shift Kerja</span>
                            </button>
                        </form>
                    </div>
                </div>

            document.getElementById("shift-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const empName = document.getElementById("shift-emp-name").value.trim();
                const outlet = document.getElementById("shift-outlet-name").value;

                if (!empName) {
                    showAlert("Wajib Diisi", "Masukkan nama karyawan bertugas.", "error");
                    return;
                }

                db.currentShift = {
                    employeeName: empName,
                    outletName: outlet,
                    startTime: new Date().toISOString()
                };
                saveDB(db);
            });
        }

        function renderApp() {
            const db = getDB();
            const appEl = document.getElementById("app");

            if (!db.currentUser) {
                renderLoginView(db);
                return;
            }

            if (db.currentUser.role === 'karyawan' && !db.currentShift.employeeName) {
                renderShiftModal(db);
                return;

            if (db.currentUser.role === 'admin' && db.activeTab === 'pos') {
                db.activeTab = 'admin_monitor';
            }

            appEl.className = "min-h-screen flex flex-col";
            appEl.innerHTML = `

                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

                            </div>
                            <div>
                                <h1 class="font-black text-white text-base leading-tight uppercase tracking-wider">PANCONG <span class="text-blue-300">LUMER</span></h1>
                                <p class="text-[11px] text-blue-200 font-semibold flex items-center space-x-1">
                                    <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                                    <span>${db.currentUser.role === 'karyawan' ? `Outlet: ${db.currentShift.outletName}` : 'Pusat Kontrol Admin'}</span>
                                </p>
                            </div>
                        </div>

                        <div class="flex items-center space-x-3">
                            <div class="text-right hidden sm:block">
                                <p class="text-xs font-bold text-white">${db.currentUser.role === 'karyawan' ? db.currentShift.employeeName : db.currentUser.name}</p>
                                <span class="text-[10px] uppercase font-black px-2 py-0.5 bg-blue-800 text-blue-200 rounded-full inline-block mt-0.5">${db.currentUser.role === 'karyawan' ? 'Staff Duty' : 'Admin Utama'}</span>
                            </div>
                            <button id="btn-logout" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span class="hidden sm:inline">Keluar</span>
                            </button>
                        </div>
                    </div>
                </header>

                <nav class="bg-white border-b border-slate-200 shadow-xs">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-2 overflow-x-auto py-2.5">
                        ${db.currentUser.role === 'karyawan' ? `
                            <button onclick="switchTab('pos')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'pos' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-cash-register"></i>
                                <span>Kasir POS</span>
                            </button>
                        ` : ''}

                        ${db.currentUser.role === 'admin' ? `
                            <button onclick="switchTab('admin_monitor')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'admin_monitor' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-chart-pie"></i>
                                <span>Pantau Laporan Shift Karyawan</span>
                            </button>
                        ` : ''}

                        <button onclick="switchTab('stock')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'stock' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-boxes-stacked"></i>
                            <span>Rekap Stok</span>
                        </button>
                        <button onclick="switchTab('sales')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'sales' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-receipt"></i>
                            <span>Penjualan Hari Ini</span>
                        </button>
                        <button onclick="switchTab('omzet')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'omzet' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-chart-line"></i>
                            <span>Laporan Omzet</span>
                        </button>

                        ${db.currentUser.role === 'karyawan' ? `
                            <button onclick="switchTab('wa_generator')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'wa_generator' ? 'bg-emerald-600 text-white shadow-md' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100'}">
                                <i class="fa-brands fa-whatsapp text-sm"></i>
                                <span>Kirim & Generator Laporan WA</span>
                            </button>
                        ` : ''}

                        ${db.currentUser.role === 'admin' ? `
                            <button onclick="switchTab('menus')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'menus' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-bars-staggered"></i>
                                <span>Daftar Menu Pancong (CRUD)</span>
                            </button>
                        ` : ''}
                    </div>
                </nav>

                <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                </main>

                <!-- Thermal Receipt Struk Modal -->
                <div id="receipt-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 flex flex-col max-h-[90vh] border border-blue-100">
                        <div class="flex justify-between items-center pb-3 border-b mb-4">
                            <h3 class="font-bold text-blue-950 text-base">Struk Thermal</h3>
                            <button onclick="closeReceiptModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="receipt-container" class="overflow-y-auto flex-1 font-mono text-xs bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-4"></div>
                        <div class="flex space-x-3">
                            <button onclick="window.print()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl shadow-md transition">Cetak Struk</button>
                            <button onclick="closeReceiptModal()" class="px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-semibold transition">Tutup</button>
                        </div>
                    </div>
                </div>

                <!-- Checkout Modal -->
                <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 border border-blue-100 text-slate-800">
                        <div class="flex justify-between items-center pb-3 border-b mb-4">
                            <h3 id="checkout-title" class="font-bold text-blue-950 text-base">Pembayaran</h3>
                            <button onclick="closeCheckoutModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="checkout-body" class="space-y-4"></div>
                    </div>
                </div>
            `;

            document.getElementById("btn-logout").addEventListener("click", () => {
                db.currentUser = null;
                db.currentShift = { employeeName: "", outletName: "", startTime: null };
                saveDB(db);
            });

            renderActiveTabContent();
        }

        window.switchTab = function(tabName) {
            const db = getDB();
            db.activeTab = tabName;
            saveDB(db);
        };

        function renderActiveTabContent() {
            const db = getDB();
            const mainEl = document.getElementById("main-content");
            if (!mainEl) return;

            if (db.activeTab === "pos") {
                mainEl.innerHTML = renderPOSView(db);
                initPOSListeners(db);
            } else if (db.activeTab === "admin_monitor") {
                mainEl.innerHTML = renderAdminMonitorView(db);
            } else if (db.activeTab === "stock") {
                mainEl.innerHTML = renderStockView(db);
            } else if (db.activeTab === "sales") {
                mainEl.innerHTML = renderSalesView(db);
            } else if (db.activeTab === "omzet") {
                mainEl.innerHTML = renderOmzetView(db);
            } else if (db.activeTab === "wa_generator") {
                mainEl.innerHTML = renderWAGeneratorView(db);
                initWAGeneratorListeners(db);
            } else if (db.activeTab === "menus") {
                mainEl.innerHTML = renderMenusView(db);
            }
        }

        // ==========================================
        // 1. KASIR POS VIEW
        // ==========================================

        window.addToCart = function(id) {
            const db = getDB();
            const p = db.products.find(x => x.id === id);
            if (!p || p.stock <= 0) return showAlert("Stok Habis", "Stok menu ini habis.", "error");
            if (!db.cart) db.cart = [];
            const ex = db.cart.find(x => x.id === id);
            if (ex) ex.qty += 1;
            else db.cart.push({ id: p.id, name: p.name, price: p.price, topping: p.topping, qty: 1 });
            saveDB(db);
        };

        window.openPaymentModal = function(method) {
            const db = getDB();
            const total = (db.cart || []).reduce((s, i) => s + (i.price * i.qty), 0);
            const modal = document.getElementById("checkout-modal");
            document.getElementById("checkout-title").textContent = method === 'cash' ? "Pembayaran Tunai" : "Pembayaran QRIS";
            document.getElementById("checkout-body").innerHTML = `

        window.closeCheckoutModal = function() { document.getElementById("checkout-modal").classList.add("hidden"); };

        window.processCheckout = function(method) {
            const db = getDB();
            const total = (db.cart || []).reduce((s, i) => s + (i.price * i.qty), 0);
            db.cart.forEach(item => {
                const p = db.products.find(x => x.id === item.id);
                if (p) p.stock -= item.qty;
            });
            const newTrx = {
                id: "TRX-" + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toISOString(),
                employeeName: db.currentUser.role === 'karyawan' ? db.currentShift.employeeName : db.currentUser.name,
                outletName: db.currentUser.role === 'karyawan' ? db.currentShift.outletName : 'Outlet Pusat',
                items: [...db.cart], total, paymentMethod: method
            };
            if (!db.transactions) db.transactions = [];
            db.transactions.unshift(newTrx);
            db.cart = [];
            saveDB(db);
            closeCheckoutModal();
            document.getElementById("receipt-container").innerHTML = `

                </div>
            `;
            document.getElementById("receipt-modal").classList.remove("hidden");
        };

            const tutup = document.getElementById("gen-tutup")?.value || "23:00";

            const tunai = parseFloat(document.getElementById("gen-tunai")?.value) || 0;
            const qris = parseFloat(document.getElementById("gen-qris")?.value) || 0;
            const online = parseFloat(document.getElementById("gen-online")?.value) || 0;
            const pengeluaran = parseFloat(document.getElementById("gen-keluar")?.value) || 0;
            const setorTunai = parseFloat(document.getElementById("gen-setor")?.value) || 0;
            const omzetTotal = tunai + qris + online;

            const newReport = {
                id: "REP-" + Math.floor(100000 + Math.random() * 900000),
                date, outletName: outlet, employeeName: staff, status: "menunggu",
                absensi: { buka, tutup },
                keuangan: { omzetTotal, tunai, qris, online, pengeluaran, setorTunai },
                penjualanPancong: { porsiTerjual: parseInt(document.getElementById("gen-terjual")?.value) || 0 }
            };

            if (!db.submittedShiftReports) db.submittedShiftReports = [];
            db.submittedShiftReports.unshift(newReport);
            saveDB(db);

            showAlert("Laporan Terkirim", "Laporan shift berhasil dikirimkan secara otomatis ke Admin!", "success");
        };

        // ==========================================
        // 4. PENJUALAN, OMZET, STOK & MENUS
        // ==========================================
        function renderSalesView(db) {
            const trx = db.transactions || [];
            const total = trx.reduce((s, t) => s + t.total, 0);
            return `
                <div class="space-y-4 text-slate-800">
                    <div class="bg-white p-6 rounded-3xl border shadow-xs flex justify-between items-center">
                        <div><p class="text-xs font-bold text-slate-500 uppercase">Total Omzet Penjualan Kasir</p><p class="text-2xl font-black text-emerald-600 mt-1">Rp ${total.toLocaleString('id-ID')}</p></div>
                        <span class="px-3 py-1 bg-blue-100 text-blue-900 rounded-full font-bold text-xs">${trx.length} Transaksi</span>
                    </div>
                    <div class="bg-white rounded-3xl border overflow-hidden p-4">
                        <h3 class="font-black text-sm mb-3">Riwayat Transaksi Kasir</h3>
                        ${trx.length === 0 ? '<p class="text-xs text-slate-400">Belum ada transaksi.</p>' : trx.map(t=>`
                            <div class="p-3 bg-slate-50 border rounded-xl mb-2 flex justify-between text-xs">
                                <div><strong>${t.id}</strong> - ${t.employeeName} (${t.outletName})</div>
                                <div class="font-black text-blue-900">Rp ${t.total.toLocaleString('id-ID')}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderOmzetView(db) {
            const total = (db.transactions || []).reduce((s, t) => s + t.total, 0);
            return `<div class="bg-white p-6 rounded-3xl border shadow-xs"><h2 class="font-black text-lg mb-2">Laporan Akumulasi Omzet</h2><p class="text-2xl font-black text-blue-900">Rp ${total.toLocaleString('id-ID')}</p></div>`;
        }

        function renderStockView(db) {
            return `
                <div class="bg-white rounded-3xl border shadow-xs p-6 space-y-4">
                    <h2 class="font-black text-base uppercase">Rekap Stok Bahan & Topping</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        ${db.rawMaterials.map(rm=>`
                            <div class="bg-slate-50 p-3 rounded-2xl border flex justify-between items-center text-xs">
                                <div><strong>${rm.name}</strong><span class="block text-[10px] text-slate-500">${rm.category}</span></div>
                                <span class="font-black text-blue-900">${rm.stock}${rm.unit}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderMenusView(db) {
            return `
                <div class="bg-white rounded-3xl border p-6 space-y-4">
                    <h2 class="font-black text-base uppercase">Daftar Menu Pancong</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        ${db.products.map(p=>`
                            <div class="bg-slate-50 p-3 rounded-xl border text-xs">
                                <strong class="text-sm block text-blue-900">${p.name}</strong>
                                <span class="text-slate-500">+ ${p.topping}</span>
                                <p class="font-black text-slate-900 mt-2">Rp ${p.price.toLocaleString('id-ID')} (Stok:${p.stock})</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.addEventListener("DOMContentLoaded", () => { renderApp(); });
        if (document.readyState === "complete" || document.readyState === "interactive") { renderApp(); }
    </script>
</body>
</html>
