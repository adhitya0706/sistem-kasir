<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pancong Lumer Kenangan - Sistem POS & Laporan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Toast / Alert Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="app" class="min-h-screen flex flex-col items-center justify-center">
        <div class="text-center space-y-3">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600"></i>
            <p class="text-xs font-bold text-slate-600 uppercase tracking-wider">Memuat Sistem Pancong Lumer...</p>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "PANCONG_LUMER_FINAL_STATE_V4";
        
        const defaultDB = {
            currentUser: null,
            currentShift: { employeeName: "", outletName: "", startTime: null },
            outlets: ["Outlet Sidoagung", "Outlet Central", "Outlet Margonda", "Outlet Tebet"],
            users: [
                { username: "admin", pin: "1234", name: "Admin Utama", role: "admin" },
                { username: "karyawan", pin: "5678", name: "Aditya", role: "karyawan" }
            ],
            rawMaterials: [
                { id: "rm1", name: "Adonan 250gr", category: "Bahan Utama", stock: 4, unit: "bks" },
                { id: "rm2", name: "Telur Ayam", category: "Bahan Utama", stock: 4, unit: "butir" },
                { id: "rm3", name: "Choco Crunchy", category: "Topping", stock: 369, unit: "gr" },
                { id: "rm4", name: "Cheese Crunchy", category: "Topping", stock: 464, unit: "gr" },
                { id: "rm5", name: "Glaze Cokelat", category: "Glaze", stock: 392, unit: "gr" },
                { id: "rm6", name: "Glaze Tiramisu", category: "Glaze", stock: 659, unit: "gr" },
                { id: "rm7", name: "Box Logo", category: "Kemasan", stock: 23, unit: "pcs" },
                { id: "rm8", name: "Box Polos", category: "Kemasan", stock: 4, unit: "pcs" }
            ],
            products: [
                { id: "p1", name: "ORSS (Original Susu)", price: 8000, stock: 20, category: "Original", topping: "Susu" },
                { id: "p2", name: "KJSS (Keju Susu)", price: 11000, stock: 15, category: "Special", topping: "Keju Parut + SKM" },
                { id: "p3", name: "C (Cokelat)", price: 10000, stock: 12, category: "Coklat", topping: "Glaze Cokelat" },
                { id: "p4", name: "CKC (Choco Crunchy)", price: 12000, stock: 12, category: "Coklat", topping: "Choco Crunchy" },
                { id: "p5", name: "TMO (Tiramisu Oreo)", price: 13000, stock: 10, category: "Premium", topping: "Tiramisu + Oreo" }
            ],
            cart: [],
            transactions: [],
            activeTab: "pos"
        };

        function getDB() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultDB));
                return defaultDB;
            }
            try {
                return JSON.parse(saved);
            } catch (e) {
                return defaultDB;
            }
        }

        function saveDB(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            renderApp();
        }

        function showAlert(title, message, type = "info") {
            const container = document.getElementById("toast-container");
            if (!container) return;
            const toast = document.createElement("div");
            const bgClass = type === "error" ? "bg-rose-600 text-white" : type === "success" ? "bg-emerald-600 text-white" : "bg-blue-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 pointer-events-auto`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-xmark' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} text-lg"></i>
                <div>
                    <h4 class="font-bold text-xs uppercase tracking-wider">${title}</h4>
                    <p class="text-xs font-medium opacity-90">${message}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==========================================
        // LOGIN & SHIFT VIEW
        // ==========================================
        function renderLoginView(db) {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl border border-blue-100 p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg">
                                <i class="fa-solid fa-stroopwafel"></i>
                            </div>
                            <h1 class="text-2xl font-black text-blue-900 uppercase">PANCONG <span class="text-blue-600">LUMER</span></h1>
                            <p class="text-xs text-slate-500 font-semibold mt-1">Sistem POS & Rekap Laporan</p>
                        </div>
                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-blue-900 mb-1">Username</label>
                                <input type="text" id="login-username" required placeholder="admin / karyawan" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm font-semibold text-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-blue-900 mb-1">PIN Akses (4 Digit)</label>
                                <input type="password" id="login-pin" maxlength="4" required placeholder="1234 / 5678" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm font-semibold text-slate-900">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition text-sm">
                                MASUK KE SISTEM
                            </button>
                        </form>
                        <div class="mt-6 pt-4 border-t text-center text-xs text-slate-500 space-y-1 bg-slate-50 p-3 rounded-2xl">
                            <p>Admin: <b>admin</b> | PIN: <b>1234</b></p>
                            <p>Karyawan: <b>karyawan</b> | PIN: <b>5678</b></p>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("login-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const u = document.getElementById("login-username").value.trim();
                const p = document.getElementById("login-pin").value.trim();
                const user = db.users.find(x => x.username === u && x.pin === p);
                if (user) {
                    db.currentUser = user;
                    saveDB(db);
                } else {
                    showAlert("Gagal", "Username atau PIN salah.", "error");
                }
            });
        }

        function renderShiftModal(db) {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-6">
                            <h2 class="text-xl font-black text-blue-950 uppercase">Presensi Shift Karyawan</h2>
                        </div>
                        <form id="shift-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-blue-900 mb-1">Nama Karyawan</label>
                                <input type="text" id="shift-emp-name" required placeholder="Nama Lengkap" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm font-semibold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-blue-900 mb-1">Outlet</label>
                                <select id="shift-outlet-name" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm font-semibold">
                                    ${db.outlets.map(o => `<option value="${o}">${o}</option>`).join('')}
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg text-sm">
                                Mulai Shift Kerja
                            </button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById("shift-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const name = document.getElementById("shift-emp-name").value.trim();
                const outlet = document.getElementById("shift-outlet-name").value;
                if (!name) return showAlert("Wajib", "Nama harus diisi.", "error");
                db.currentShift = { employeeName: name, outletName: outlet, startTime: new Date().toISOString() };
                saveDB(db);
            });
        }

        // ==========================================
        // APLIKASI UTAMA (4 FORM)
        // ==========================================
        function renderApp() {
            const db = getDB();
            const appEl = document.getElementById("app");

            if (!db.currentUser) { renderLoginView(db); return; }
            if (db.currentUser.role === 'karyawan' && !db.currentShift.employeeName) { renderShiftModal(db); return; }

            appEl.className = "min-h-screen flex flex-col";
            appEl.innerHTML = `
                <header class="bg-blue-900 text-white sticky top-0 z-30 shadow-md">
                    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-white text-blue-900 rounded-xl flex items-center justify-center font-bold">
                                <i class="fa-solid fa-stroopwafel text-blue-600 text-xl"></i>
                            </div>
                            <div>
                                <h1 class="font-black text-white text-base uppercase">PANCONG LUMER</h1>
                                <p class="text-[11px] text-blue-200">${db.currentUser.role === 'karyawan' ? `Outlet: ${db.currentShift.outletName}` : 'Admin Utama'}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-bold">${db.currentUser.role === 'karyawan' ? db.currentShift.employeeName : db.currentUser.name}</span>
                            <button id="btn-logout" class="bg-rose-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">Keluar</button>
                        </div>
                    </div>
                </header>

                <nav class="bg-white border-b shadow-xs">
                    <div class="max-w-7xl mx-auto px-4 flex space-x-2 overflow-x-auto py-2.5">
                        <button onclick="switchTab('pos')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'pos' ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-cash-register mr-1"></i> 1. Kasir</button>
                        <button onclick="switchTab('stock')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'stock' ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-boxes-stacked mr-1"></i> 2. Rekap Stok</button>
                        <button onclick="switchTab('sales')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'sales' ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-receipt mr-1"></i> 3. Penjualan Hari Ini</button>
                        <button onclick="switchTab('omzet')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'omzet' ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-chart-line mr-1"></i> 4. Omzet</button>
                    </div>
                </nav>

                <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6"></main>

                <!-- Receipt Modal -->
                <div id="receipt-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 flex flex-col">
                        <div class="flex justify-between items-center pb-3 border-b mb-4">
                            <h3 class="font-bold text-base">Struk Pembayaran</h3>
                            <button onclick="closeReceiptModal()" class="w-8 h-8 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="receipt-container" class="font-mono text-xs bg-slate-50 p-4 rounded-2xl mb-4"></div>
                        <button onclick="window.print()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-xs">Cetak Struk</button>
                    </div>
                </div>

                <!-- Checkout Modal -->
                <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6">
                        <div class="flex justify-between items-center pb-3 border-b mb-4">
                            <h3 id="checkout-title" class="font-bold text-base">Pembayaran</h3>
                            <button onclick="closeCheckoutModal()" class="w-8 h-8 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="checkout-body" class="space-y-4"></div>
                    </div>
                </div>
            `;

            document.getElementById("btn-logout").addEventListener("click", () => {
                db.currentUser = null;
                db.currentShift = { employeeName: "", outletName: "", startTime: null };
                saveDB(db);
            });

            renderActiveTabContent();
        }

        window.switchTab = function(tabName) {
            const db = getDB();
            db.activeTab = tabName;
            saveDB(db);
        };

        function renderActiveTabContent() {
            const db = getDB();
            const mainEl = document.getElementById("main-content");
            if (!mainEl) return;

            if (db.activeTab === "pos") {
                mainEl.innerHTML = renderPOSView(db);
                initPOSListeners(db);
            } else if (db.activeTab === "stock") {
                mainEl.innerHTML = renderStockView(db);
            } else if (db.activeTab === "sales") {
                mainEl.innerHTML = renderSalesView(db);
            } else if (db.activeTab === "omzet") {
                mainEl.innerHTML = renderOmzetView(db);
            }
        }

        // ==========================================
        // 1. FORM KASIR (POS)
        // ==========================================
        function renderPOSView(db) {
            const cartTotal = (db.cart || []).reduce((sum, item) => sum + (item.price * item.qty), 0);
            return `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div class="lg:col-span-8 space-y-4">
                        <div class="bg-white p-4 rounded-2xl border">
                            <input type="text" id="pos-search" placeholder="Cari menu pancong..." class="w-full px-4 py-2.5 bg-slate-50 border rounded-xl text-sm">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="pos-products-grid">
                            ${db.products.map(p => `
                                <div data-name="${p.name.toLowerCase()}" class="product-card bg-white rounded-2xl border p-4 shadow-xs flex flex-col justify-between">
                                    <div>
                                        <span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded-lg text-[10px] font-bold">${p.category}</span>
                                        <h3 class="font-black text-slate-900 text-base mt-2">${p.name}</h3>
                                        <p class="text-xs text-slate-500 mt-1">+ ${p.topping}</p>
                                    </div>
                                    <div class="mt-4 pt-3 border-t flex justify-between items-center">
                                        <span class="font-black text-blue-900 text-sm">Rp ${p.price.toLocaleString('id-ID')}</span>
                                        <button onclick="addToCart('${p.id}')" class="px-3 py-1.5 bg-blue-600 text-white font-bold rounded-xl text-xs">Tambah</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="lg:col-span-4">
                        <div class="bg-white rounded-3xl border p-5 shadow-lg sticky top-20 space-y-4">
                            <h2 class="font-black text-blue-950 text-base uppercase">Keranjang Kasir</h2>
                            <div class="max-h-[300px] overflow-y-auto space-y-2">
                                ${(!db.cart || db.cart.length === 0) ? '<p class="text-xs text-slate-400 text-center py-6">Keranjang kosong</p>' : db.cart.map(item => `
                                    <div class="bg-slate-50 p-2.5 rounded-xl flex justify-between items-center text-xs">
                                        <div><strong>${item.name}</strong> x${item.qty}</div>
                                        <div class="font-bold text-blue-900">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="pt-3 border-t space-y-2">
                                <div class="flex justify-between font-black text-sm"><span>Total:</span><span>Rp ${cartTotal.toLocaleString('id-ID')}</span></div>
                                <button onclick="openPaymentModal('cash')" ${(!db.cart || db.cart.length === 0) ? 'disabled' : ''} class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-xs">Bayar Tunai</button>
                                <button onclick="openPaymentModal('qris')" ${(!db.cart || db.cart.length === 0) ? 'disabled' : ''} class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs">Bayar QRIS</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function initPOSListeners(db) {
            document.getElementById("pos-search")?.addEventListener("input", (e) => {
                const q = e.target.value.toLowerCase();
                document.querySelectorAll(".product-card").forEach(c => {
                    c.style.display = c.getAttribute("data-name").includes(q) ? "flex" : "none";
                });
            });
        }

        window.addToCart = function(id) {
            const db = getDB();
            const p = db.products.find(x => x.id === id);
            if (!p) return;
            if (!db.cart) db.cart = [];
            const ex = db.cart.find(x => x.id === id);
            if (ex) ex.qty += 1;
            else db.cart.push({ id: p.id, name: p.name, price: p.price, topping: p.topping, qty: 1 });
            saveDB(db);
        };

        window.openPaymentModal = function(method) {
            const db = getDB();
            const total = (db.cart || []).reduce((s, i) => s + (i.price * i.qty), 0);
            const modal = document.getElementById("checkout-modal");
            document.getElementById("checkout-title").textContent = method === 'cash' ? "Pembayaran Tunai" : "Pembayaran QRIS";
            document.getElementById("checkout-body").innerHTML = `
                <p class="text-sm font-bold text-center">Total Tagihan: Rp ${total.toLocaleString('id-ID')}</p>
                ${method === 'cash' ? `
                    <div>
                        <label class="text-xs font-bold">Uang Tunai Diterima (Rp)</label>
                        <input type="number" id="cash-in" placeholder="Contoh: 50000" class="w-full border p-2.5 rounded-xl mt-1 font-bold text-blue-900">
                    </div>
                    <div id="change-box" class="hidden bg-emerald-50 p-3 rounded-xl text-center">
                        <span class="text-xs font-bold text-emerald-800">Kembalian:</span>
                        <p id="change-amount" class="text-lg font-black text-emerald-700">Rp 0</p>
                    </div>
                ` : '<p class="text-center text-xs text-slate-500 py-3">Scan QRIS Kasir</p>'}
                <button onclick="processCheckout('${method}')" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mt-3 text-xs">Proses Pembayaran</button>
            `;
            modal.classList.remove("hidden");

            if (method === 'cash') {
                const input = document.getElementById("cash-in");
                input.focus();
                input.addEventListener("input", (e) => {
                    const paid = parseFloat(e.target.value) || 0;
                    const change = paid - total;
                    const changeBox = document.getElementById("change-box");
                    const changeAmt = document.getElementById("change-amount");
                    if (paid >= total) {
                        changeBox.classList.remove("hidden");
                        changeAmt.textContent = `Rp ${change.toLocaleString('id-ID')}`;
                    } else {
                        changeBox.classList.add("hidden");
                    }
                });
            }
        };

        window.closeCheckoutModal = function() { document.getElementById("checkout-modal").classList.add("hidden"); };
        window.closeReceiptModal = function() { document.getElementById("receipt-modal").classList.add("hidden"); };

        window.processCheckout = function(method) {
            const db = getDB();
            const total = (db.cart || []).reduce((s, i) => s + (i.price * i.qty), 0);
            let cashPaid = total;
            let change = 0;

            if (method === 'cash') {
                cashPaid = parseFloat(document.getElementById("cash-in")?.value) || 0;
                if (cashPaid < total) return showAlert("Kurang", "Uang tunai kurang dari total tagihan.", "error");
                change = cashPaid - total;
            }

            const newTrx = {
                id: "TRX-" + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toISOString(),
                employeeName: db.currentUser.role === 'karyawan' ? db.currentShift.employeeName : db.currentUser.name,
                outletName: db.currentUser.role === 'karyawan' ? db.currentShift.outletName : 'Outlet Pusat',
                items: [...db.cart], total, paymentMethod: method, cashPaid, change
            };

            if (!db.transactions) db.transactions = [];
            db.transactions.unshift(newTrx);
            db.cart = [];
            saveDB(db);
            closeCheckoutModal();

            document.getElementById("receipt-container").innerHTML = `
                <div id="printable-receipt" class="text-center space-y-1">
                    <h2 class="font-bold">PANCONG LUMER KENANGAN</h2>
                    <p>${newTrx.outletName}</p>
                    <hr class="my-1">
                    <div class="text-left">${newTrx.items.map(i=>`<div>${i.name} x${i.qty} - Rp${(i.price*i.qty).toLocaleString('id-ID')}</div>`).join('')}</div>
                    <hr class="my-1">
                    <div class="flex justify-between font-bold"><span>Total:</span><span>Rp ${total.toLocaleString('id-ID')}</span></div>
                    <div class="flex justify-between"><span>Bayar (${method.toUpperCase()}):</span><span>Rp ${cashPaid.toLocaleString('id-ID')}</span></div>
                    <div class="flex justify-between font-bold text-emerald-700"><span>Kembalian:</span><span>Rp ${change.toLocaleString('id-ID')}</span></div>
                </div>
            `;
            document.getElementById("receipt-modal").classList.remove("hidden");
        };

        // ==========================================
        // 2. FORM REKAP STOK + TOMBOL SALIN
        // ==========================================
        function renderStockView(db) {
            const stockText = `*#REKAP STOK BAHAN & TOPPING*\n` + db.rawMaterials.map(rm => `- ${rm.name} : ${rm.stock} ${rm.unit}`).join('\n');
            return `
                <div class="space-y-4 text-slate-800">
                    <div class="bg-white p-6 rounded-3xl border shadow-xs flex justify-between items-center">
                        <div>
                            <h2 class="font-black text-lg uppercase">2. Rekap Stok Barang</h2>
                            <p class="text-xs text-slate-500">Kelola stok dan salin rekap stok untuk WhatsApp.</p>
                        </div>
                        <button onclick="copyText('${encodeURIComponent(stockText)}', 'Rekap Stok')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-md">
                            <i class="fa-solid fa-copy mr-1"></i> Salin Rekap Stok WA
                        </button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        ${db.rawMaterials.map(rm=>`
                            <div class="bg-white p-4 rounded-2xl border flex justify-between items-center text-xs shadow-xs">
                                <div><strong>${rm.name}</strong><span class="block text-[10px] text-slate-500">${rm.category}</span></div>
                                <span class="font-black text-blue-900">${rm.stock}${rm.unit}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 3. FORM PENJUALAN HARI INI + TOMBOL SALIN
        // ==========================================
        function renderSalesView(db) {
            const todayStr = new Date().toDateString();
            const trx = (db.transactions || []).filter(t => new Date(t.date).toDateString() === todayStr);
            const total = trx.reduce((s, t) => s + t.total, 0);

            const salesText = `*#PENJUALAN HARI INI*\nTotal Transaksi: ${trx.length} Pesanan\nTotal Omzet: Rp ${total.toLocaleString('id-ID')}\n\n` + 
                trx.map(t => `- ${t.id} (${t.employeeName}): Rp ${t.total.toLocaleString('id-ID')} [${t.paymentMethod.toUpperCase()}]`).join('\n');

            return `
                <div class="space-y-4 text-slate-800">
                    <div class="bg-white p-6 rounded-3xl border shadow-xs flex justify-between items-center">
                        <div>
                            <h2 class="font-black text-lg uppercase">3. Penjualan Hari Ini</h2>
                            <p class="text-xs text-slate-500">Total Omzet Hari Ini: <b class="text-emerald-600">Rp ${total.toLocaleString('id-ID')}</b></p>
                        </div>
                        <button onclick="copyText('${encodeURIComponent(salesText)}', 'Penjualan Hari Ini')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-md">
                            <i class="fa-solid fa-copy mr-1"></i> Salin Penjualan WA
                        </button>
                    </div>
                    <div class="bg-white rounded-3xl border overflow-hidden p-4">
                        <h3 class="font-black text-sm mb-3">Daftar Transaksi Masuk (${trx.length})</h3>
                        ${trx.length === 0 ? '<p class="text-xs text-slate-400">Belum ada transaksi hari ini.</p>' : trx.map(t=>`
                            <div class="p-3 bg-slate-50 border rounded-xl mb-2 flex justify-between text-xs">
                                <div><strong>${t.id}</strong> - ${t.employeeName} (${t.outletName})<br><span class="text-[10px] text-slate-500">${new Date(t.date).toLocaleTimeString()}</span></div>
                                <div class="font-black text-blue-900">Rp ${t.total.toLocaleString('id-ID')} (${t.paymentMethod})</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 4. FORM OMZET + TOMBOL SALIN
        // ==========================================
        function renderOmzetView(db) {
            const trx = db.transactions || [];
            const total = trx.reduce((s, t) => s + t.total, 0);

            const omzetText = `*#LAPORAN OMZET KESELURUHAN*\nTotal Seluruh Pesanan: ${trx.length} Pesanan\nAkumulasi Omzet: Rp ${total.toLocaleString('id-ID')}`;

            return `
                <div class="space-y-4 text-slate-800">
                    <div class="bg-white p-6 rounded-3xl border shadow-xs flex justify-between items-center">
                        <div>
                            <h2 class="font-black text-lg uppercase">4. Laporan Omzet</h2>
                            <p class="text-xs text-slate-500">Akumulasi seluruh pendapatan kasir.</p>
                        </div>
                        <button onclick="copyText('${encodeURIComponent(omzetText)}', 'Omzet')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-md">
                            <i class="fa-solid fa-copy mr-1"></i> Salin Omzet WA
                        </button>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border shadow-xs">
                        <p class="text-xs font-bold text-slate-500 uppercase">Total Akumulasi Omzet</p>
                        <p class="text-3xl font-black text-blue-900 mt-1">Rp ${total.toLocaleString('id-ID')}</p>
                        <p class="text-xs text-slate-500 mt-2">${trx.length} Transaksi Berhasil Tercatat</p>
                    </div>
                </div>
            `;
        }

        window.copyText = function(encodedText, title) {
            const decoded = decodeURIComponent(encodedText);
            navigator.clipboard.writeText(decoded).then(() => {
                showAlert("Berhasil Disalin", `Teks laporan "${title}" berhasil disalin ke clipboard!`, "success");
            });
        };

        window.addEventListener("DOMContentLoaded", () => { renderApp(); });
        if (document.readyState === "complete" || document.readyState === "interactive") { renderApp(); }
    </script>
</body>
</html>
