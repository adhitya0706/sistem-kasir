<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pancong Lumer Kenangan - POS & Stok System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Toast / Alert Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="app" class="min-h-screen flex flex-col items-center justify-center">
        <div class="text-center space-y-3">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600"></i>
            <p class="text-xs font-bold text-slate-600 uppercase tracking-wider">Memuat Sistem Pancong Lumer...</p>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "PANCONG_LUMER_VERCEL_STATE_V1";
        
        const defaultDB = {
            currentUser: null,
            currentShift: { employeeName: "", outletName: "", startTime: null },
            outlets: ["Outlet Sidoagung", "Outlet Central", "Outlet Margonda", "Outlet Tebet"],
            users: [
                { username: "admin", pin: "1234", name: "Admin Utama", role: "admin" },
                { username: "karyawan", pin: "5678", name: "Aditya", role: "karyawan" }
            ],
            rawMaterials: [
                { id: "rm1", name: "Adonan 250gr", category: "Bahan Utama & Adonan", stock: 4, unit: "bks" },
                { id: "rm2", name: "Telur Ayam", category: "Bahan Utama & Adonan", stock: 4, unit: "butir" },
                { id: "rm3", name: "Choco Crunchy", category: "Variasi Topping & Glaze", stock: 369, unit: "gr" },
                { id: "rm4", name: "Cheese Crunchy", category: "Variasi Topping & Glaze", stock: 464, unit: "gr" },
                { id: "rm5", name: "Glaze Cokelat", category: "Variasi Topping & Glaze", stock: 392, unit: "gr" },
                { id: "rm6", name: "Glaze Tiramisu", category: "Variasi Topping & Glaze", stock: 659, unit: "gr" },
                { id: "rm7", name: "Glaze Green Tea", category: "Variasi Topping & Glaze", stock: 373, unit: "gr" },
                { id: "rm8", name: "Glaze Pandan", category: "Variasi Topping & Glaze", stock: 266, unit: "gr" },
                { id: "rm9", name: "Glaze Durian", category: "Variasi Topping & Glaze", stock: 218, unit: "gr" },
                { id: "rm10", name: "Glaze Blueberry", category: "Variasi Topping & Glaze", stock: 412, unit: "gr" },
                { id: "rm11", name: "Keju Cheddar", category: "Variasi Topping & Glaze", stock: 519, unit: "gr" },
                { id: "rm12", name: "Susu SKM", category: "Variasi Topping & Glaze", stock: 213, unit: "ml" },
                { id: "rm13", name: "Oreo Crumb", category: "Variasi Topping & Glaze", stock: 166, unit: "gr" },
                { id: "rm14", name: "Chocochips", category: "Variasi Topping & Glaze", stock: 218, unit: "gr" },
                { id: "rm15", name: "Kacang Sangrai", category: "Variasi Topping & Glaze", stock: 185, unit: "gr" },
                { id: "rm16", name: "Milo Sachet", category: "Variasi Topping & Glaze", stock: 4, unit: "bks" },
                { id: "rm17", name: "Box Logo", category: "Kemasan & Dus", stock: 23, unit: "pcs" },
                { id: "rm18", name: "Box Polos", category: "Kemasan & Dus", stock: 4, unit: "pcs" },
                { id: "rm19", name: "Sendok Bebek", category: "Kemasan & Dus", stock: 126, unit: "gr" },
                { id: "rm20", name: "Kresek Kecil", category: "Kemasan & Dus", stock: 115, unit: "gr" }
            ],
            products: [
                { id: "p1", name: "ORSS (Original Susu)", price: 8000, stock: 20, category: "Original", topping: "Susu" },
                { id: "p2", name: "KJSS (Keju Susu)", price: 11000, stock: 15, category: "Special", topping: "Keju Parut + SKM" },
                { id: "p3", name: "C (Cokelat)", price: 10000, stock: 12, category: "Coklat", topping: "Glaze Cokelat" },
                { id: "p4", name: "CKJ (Cokelat Keju)", price: 13000, stock: 8, category: "Special", topping: "Cokelat + Keju" },
                { id: "p5", name: "CKC (Choco Crunchy)", price: 12000, stock: 12, category: "Coklat", topping: "Choco Crunchy" },
                { id: "p6", name: "TMO (Tiramisu Oreo)", price: 13000, stock: 10, category: "Premium", topping: "Tiramisu + Oreo" },
                { id: "p7", name: "GT (Green Tea)", price: 10000, stock: 5, category: "Premium", topping: "Green Tea" },
                { id: "p8", name: "DUR (Durian)", price: 10000, stock: 10, category: "Premium", topping: "Durian" },
                { id: "p9", name: "MLOS (Milo Susu)", price: 11000, stock: 10, category: "Special", topping: "Milo + Susu" },
                { id: "p10", name: "BB (Blueberry)", price: 10000, stock: 10, category: "Fruit", topping: "Blueberry" }
            ],
            cart: [],
            transactions: [],
            submittedShiftReports: [
                {
                    id: "REP-982104",
                    date: "18 Oktober 2026",
                    outletName: "Outlet Sidoagung",
                    employeeName: "Aditya",
                    status: "menunggu",
                    absensi: { buka: "16:30", tutup: "23:30" },
                    keuangan: { omzetTotal: 316000, tunai: 126000, qris: 108000, online: 82000, pengeluaran: 75000, pengeluaranNote: "Lampu Bohlam", setorTunai: 51000, bonusPegawai: 5000 },
                    penjualanPancong: { adonanDibuat: 6, porsiTerjual: 27, porsiGratis: 0, porsiSisa: 3, porsiTotalDibuat: 30 }
                }
            ],
            activeTab: "pos",
            selectedOutletFilter: "All"
        };

        function getDB() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultDB));
                return defaultDB;
            }
            try {
                const parsed = JSON.parse(saved);
                if (!parsed.submittedShiftReports) parsed.submittedShiftReports = defaultDB.submittedShiftReports;
                if (!parsed.transactions) parsed.transactions = [];
                return parsed;
            } catch (e) {
                return defaultDB;
            }
        }

        function saveDB(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            renderApp();
        }

        function showAlert(title, message, type = "info") {
            const container = document.getElementById("toast-container");
            if (!container) return;

            const toast = document.createElement("div");
            const bgClass = type === "error" ? "bg-rose-600 text-white" : type === "success" ? "bg-emerald-600 text-white" : "bg-blue-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 transition-all duration-300 pointer-events-auto transform translate-y-0`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-xmark' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} text-lg"></i>
                <div>
                    <h4 class="font-bold text-xs uppercase tracking-wider">${title}</h4>
                    <p class="text-xs font-medium opacity-90">${message}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function renderLoginView(db) {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl border border-blue-100 p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg ring-4 ring-blue-100">
                                <i class="fa-solid fa-stroopwafel"></i>
                            </div>
                            <h1 class="text-2xl font-black text-blue-900 uppercase tracking-wide">PANCONG <span class="text-blue-600">LUMER</span></h1>
                            <p class="text-xs text-slate-500 font-semibold mt-1">Sistem POS Kasir & Laporan Shift</p>
                        </div>

                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Username</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" id="login-username" required placeholder="admin / karyawan" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900 font-semibold">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">PIN Akses (4 Digit)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="login-pin" maxlength="4" required placeholder="1234 / 5678" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900 font-semibold">
                                </div>
                            </div>

                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                                <span>MASUK KE SISTEM</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>

                        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500 space-y-1 bg-slate-50 p-3 rounded-2xl">
                            <p><strong class="text-blue-900">Akun Demo Default:</strong></p>
                            <p>Admin: <code class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">admin</code> | PIN <code class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">1234</code></p>
                            <p>Karyawan: <code class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">karyawan</code> | PIN <code class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">5678</code></p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById("login-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const username = document.getElementById("login-username").value.trim();
                const pin = document.getElementById("login-pin").value.trim();

                const user = db.users.find(u => u.username === username && u.pin === pin);
                if (user) {
                    db.currentUser = user;
                    saveDB(db);
                } else {
                    showAlert("Login Gagal", "Username atau PIN salah.", "error");
                }
            });
        }

        function renderShiftModal(db) {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl border border-blue-100 p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3 shadow-sm">
                                <i class="fa-solid fa-id-card-clip"></i>
                            </div>
                            <h2 class="text-xl font-black text-blue-950 uppercase">Presensi Shift Karyawan</h2>
                            <p class="text-xs text-slate-500 mt-1">Masukkan nama & pilih outlet jaga hari ini</p>
                        </div>
                        <form id="shift-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Nama Karyawan</label>
                                <input type="text" id="shift-emp-name" required placeholder="Masukkan Nama Lengkap" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Outlet Pancong</label>
                                <select id="shift-outlet-name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                                    ${db.outlets.map(o => `<option value="${o}">${o}</option>`).join('')}
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                                <i class="fa-solid fa-circle-check"></i>
                                <span>Mulai Shift Kerja</span>
                            </button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById("shift-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const empName = document.getElementById("shift-emp-name").value.trim();
                const outlet = document.getElementById("shift-outlet-name").value;

                if (!empName) {
                    showAlert("Wajib Diisi", "Masukkan nama karyawan bertugas.", "error");
                    return;
                }

                db.currentShift = {
                    employeeName: empName,
                    outletName: outlet,
                    startTime: new Date().toISOString()
                };
                saveDB(db);
            });
        }

        function renderApp() {
            const db = getDB();
            const appEl = document.getElementById("app");

            if (!db.currentUser) {
                renderLoginView(db);
                return;
            }

            if (db.currentUser.role === 'karyawan' && !db.currentShift.employeeName) {
                renderShiftModal(db);
                return;
            }

            if (db.currentUser.role === 'admin' && db.activeTab === 'pos') {
                db.activeTab = 'admin_monitor';
                saveDB(db);
            }

            const todayFormattedInput = new Date().toISOString().split('T')[0];

            appEl.className = "min-h-screen flex flex-col";
            appEl.innerHTML = `
                <header class="bg-blue-900 text-white sticky top-0 z-30 shadow-md">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-white text-blue-900 rounded-xl flex items-center justify-center font-bold shadow-md">
                                <i class="fa-solid fa-stroopwafel text-blue-600 text-xl"></i>
                            </div>
                            <div>
                                <h1 class="font-black text-white text-base leading-tight uppercase tracking-wider">PANCONG <span class="text-blue-300">LUMER</span></h1>
                                <p class="text-[11px] text-blue-200 font-semibold flex items-center space-x-1">
                                    <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                                    <span>${db.currentUser.role === 'karyawan' ? `Outlet: ${db.currentShift.outletName}` : 'Pusat Kontrol Admin'}</span>
                                </p>
                            </div>
                        </div>

                        <div class="flex items-center space-x-3">
                            <div class="text-right hidden sm:block">
                                <p class="text-xs font-bold text-white">${db.currentUser.role === 'karyawan' ? db.currentShift.employeeName : db.currentUser.name}</p>
                                <span class="text-[10px] uppercase font-black px-2 py-0.5 bg-blue-800 text-blue-200 rounded-full inline-block mt-0.5">${db.currentUser.role === 'karyawan' ? 'Staff Duty' : 'Admin Utama'}</span>
                            </div>
                            ${db.currentUser.role === 'karyawan' ? `
                                <button onclick="openShiftReportForm()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow-sm">
                                    <i class="fa-solid fa-paper-plane"></i>
                                    <span>Kirim Laporan Shift</span>
                                </button>
                            ` : ''}
                            <button id="btn-logout" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span class="hidden sm:inline">Keluar</span>
                            </button>
                        </div>
                    </div>
                </header>

                <nav class="bg-white border-b border-slate-200 shadow-xs">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-2 overflow-x-auto py-2.5">
                        ${db.currentUser.role === 'karyawan' ? `
                            <button onclick="switchTab('pos')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'pos' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-cash-register"></i>
                                <span>Kasir POS</span>
                            </button>
                        ` : ''}

                        ${db.currentUser.role === 'admin' ? `
                            <button onclick="switchTab('admin_monitor')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'admin_monitor' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-chart-pie"></i>
                                <span>Pantau Laporan Shift Karyawan</span>
                            </button>
                        ` : ''}

                        <button onclick="switchTab('stock')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'stock' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-boxes-stacked"></i>
                            <span>Rekap Stok Adonan & Topping</span>
                        </button>
                        <button onclick="switchTab('sales')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'sales' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-receipt"></i>
                            <span>Penjualan Hari Ini</span>
                        </button>
                        <button onclick="switchTab('omzet')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'omzet' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                            <i class="fa-solid fa-chart-line"></i>
                            <span>Laporan Omzet</span>
                        </button>

                        ${db.currentUser.role === 'admin' ? `
                            <button onclick="switchTab('menus')" class="nav-tab px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition ${db.activeTab === 'menus' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-bars-staggered"></i>
                                <span>Daftar Menu Pancong (CRUD)</span>
                            </button>
                        ` : ''}
                    </div>
                </nav>

                <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                </main>

                <!-- Form Modal Shift Report Karyawan -->
                <div id="shift-report-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 overflow-y-auto backdrop-blur-xs">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full p-6 text-slate-800 my-8 max-h-[90vh] overflow-y-auto border border-blue-100">
                        <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
                            <h3 class="font-black text-blue-950 text-base uppercase"><i class="fa-solid fa-file-lines mr-2 text-blue-600"></i> Form Laporan Penjualan & Stok Shift</h3>
                            <button onclick="closeShiftReportForm()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form id="shift-report-form" class="space-y-4 text-xs">
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-blue-50 p-3 rounded-2xl border border-blue-100">
                                <div>
                                    <label class="block font-bold text-blue-900 mb-1"><i class="fa-solid fa-calendar-days mr-1 text-blue-600"></i>Tanggal Laporan</label>
                                    <input type="date" id="rep-date" required value="${todayFormattedInput}" class="w-full bg-white border border-blue-200 rounded-xl p-2 text-slate-900 font-bold">
                                </div>
                                <div>
                                    <label class="block font-bold text-blue-900 mb-1">Outlet</label>
                                    <input type="text" id="rep-outlet" readonly value="${db.currentShift.outletName || 'Outlet Sidoagung'}" class="w-full bg-white border border-blue-200 rounded-xl p-2 text-slate-900 font-bold">
                                </div>
                                <div>
                                    <label class="block font-bold text-blue-900 mb-1">Nama Staff</label>
                                    <input type="text" id="rep-staff" readonly value="${db.currentShift.employeeName || 'Aditya'}" class="w-full bg-white border border-blue-200 rounded-xl p-2 text-slate-900 font-bold">
                                </div>
                            </div>

                            <div class="border border-slate-200 rounded-2xl p-3 space-y-2">
                                <h4 class="font-black text-blue-900 uppercase text-xs"># ABSENSI SHIFT</h4>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-slate-600 mb-1">Jam Buka</label>
                                        <input type="text" id="rep-buka" placeholder="16:30" value="16:30" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-semibold text-slate-900">
                                    </div>
                                    <div>
                                        <label class="block text-slate-600 mb-1">Jam Tutup</label>
                                        <input type="text" id="rep-tutup" placeholder="23:30" value="23:30" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-semibold text-slate-900">
                                    </div>
                                </div>
                            </div>

                            <div class="border border-slate-200 rounded-2xl p-3 space-y-2">
                                <h4 class="font-black text-blue-900 uppercase text-xs"># REKAP KEUANGAN</h4>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    <div>
                                        <label class="block text-slate-600 mb-1">Tunai (Rp)</label>
                                        <input type="number" id="rep-tunai" value="126000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-bold text-blue-700">

        window.addToCart = function(productId) {
            const db = getDB();
            const product = db.products.find(p => p.id === productId);
            if (!product || product.stock <= 0) {
                showAlert("Stok Habis", "Maaf, stok varian ini sudah habis.", "error");
                return;
            }

            if (!db.cart) db.cart = [];
            const existing = db.cart.find(item => item.id === productId);
            if (existing) {
                if (existing.qty + 1 > product.stock) {
                    showAlert("Stok Cukup", "Jumlah melebihi ketersediaan stok.", "error");
                    return;
                }
                existing.qty += 1;
            } else {
                db.cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    topping: product.topping,
                    qty: 1
                });
            }
            saveDB(db);
        };

        window.updateQty = function(productId, delta) {
            const db = getDB();
            const product = db.products.find(p => p.id === productId);
            const item = (db.cart || []).find(i => i.id === productId);
            if (!item) return;

            const newQty = item.qty + delta;
            if (newQty > product.stock) {
                showAlert("Stok Cukup", "Jumlah melebihi stok yang ada.", "error");
                return;
            }

            if (newQty <= 0) {
                db.cart = db.cart.filter(i => i.id !== productId);
            } else {
                item.qty = newQty;
            }
            saveDB(db);
        };

        window.processCheckout = function(method) {
            const db = getDB();
            const total = (db.cart || []).reduce((sum, item) => sum + (item.price * item.qty), 0);
            let cashPaid = total;
            let change = 0;

            if (method === 'cash') {
                const paidInput = document.getElementById("cash-paid-input");
                cashPaid = parseFloat(paidInput.value) || 0;
                if (cashPaid < total) {
                    showAlert("Uang Kurang", "Uang tunai kurang dari total tagihan.", "error");
                    return;
                }
                change = cashPaid - total;
            }

            db.cart.forEach(cartItem => {
                const product = db.products.find(p => p.id === cartItem.id);
                if (product) {
                    product.stock -= cartItem.qty;
                }
            });

            const empName = db.currentUser.role === 'karyawan' ? db.currentShift.employeeName : db.currentUser.name;
            const outletName = db.currentUser.role === 'karyawan' ? db.currentShift.outletName : 'Outlet Central (Admin)';

            const newTrx = {
                id: "TRX-" + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toISOString(),
                employeeName: empName,
                outletName: outletName,
                items: [...db.cart],
                total: total,
                paymentMethod: method,
                cashPaid: cashPaid,
                change: change
            };

            if (!db.transactions) db.transactions = [];
            db.transactions.unshift(newTrx);
            db.cart = [];
            saveDB(db);

            closeCheckoutModal();
            showReceiptModal(newTrx);
        };

            const addQty = parseInt(input.value) || 0;
            if (addQty <= 0) return;

            const rm = db.rawMaterials.find(item => item.id === rawId);
            if (rm) {
                rm.stock += addQty;
                saveDB(db);
                showAlert("Stok Diperbarui", `Berhasil menambah ${addQty} ${rm.unit} untuk ${rm.name}.`, "success");
            }
        };

        function renderSalesView(db) {
            const todayStr = new Date().toDateString();
            const todayTrx = (db.transactions || []).filter(trx => new Date(trx.date).toDateString() === todayStr);
            const totalOmzetToday = todayTrx.reduce((sum, trx) => sum + trx.total, 0);

            return `
                <div class="space-y-6 text-slate-800">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-white p-6 rounded-3xl shadow-xs border border-slate-200 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Total Transaksi Hari Ini</p>
                                <p class="text-3xl font-black text-blue-950 mt-1">${todayTrx.length} Pesanan</p>
                            </div>
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl font-bold">
                                <i class="fa-solid fa-receipt"></i>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-xs border border-slate-200 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Omzet Penjualan Hari Ini</p>
                                <p class="text-3xl font-black text-emerald-600 mt-1">Rp ${totalOmzetToday.toLocaleString('id-ID')}</p>
                            </div>
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl font-bold">
                                <i class="fa-solid fa-wallet"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-xs border border-slate-200 overflow-hidden">
                        <div class="p-6 border-b border-slate-100 bg-slate-50">
                            <h3 class="font-black text-blue-950 text-base">Riwayat Transaksi Dine-In Hari Ini</h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200 text-blue-900 text-xs font-bold uppercase tracking-wider">
                                        <th class="p-4">ID Transaksi</th>
                                        <th class="p-4">Waktu</th>
                                        <th class="p-4">Staff / Outlet</th>
                                        <th class="p-4">Varian & Topping</th>
                                        <th class="p-4">Metode</th>
                                        <th class="p-4 text-right">Total</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${todayTrx.length === 0 ? `
                                        <tr><td colspan="6" class="p-8 text-center text-slate-400">Belum ada transaksi hari ini.</td></tr>
                                    ` : todayTrx.map(trx => `
                                        <tr>
                                            <td class="p-4 font-black text-blue-900 font-mono text-xs">${trx.id}</td>
                                            <td class="p-4 text-slate-500 text-xs">${new Date(trx.date).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'})}</td>
                                            <td class="p-4">
                                                <p class="font-bold text-slate-900 text-xs">${trx.employeeName || '-'}</p>
                                                <p class="text-[10px] text-blue-700 font-semibold">${trx.outletName || '-'}</p>
                                            </td>
                                            <td class="p-4">
                                                <div class="space-y-1">
                                                    ${trx.items.map(i => `
                                                        <div class="text-xs"><strong class="text-slate-900">${i.name}</strong> (x${i.qty}) <span class="text-[10px] text-blue-700 block">Topping: ${i.topping}</span></div>
                                                    `).join('')}
                                                </div>
                                            </td>
                                            <td class="p-4"><span class="uppercase text-xs font-extrabold px-2.5 py-1 bg-blue-100 text-blue-800 rounded-lg">${trx.paymentMethod}</span></td>
                                            <td class="p-4 text-right font-black text-blue-900 text-base">Rp ${trx.total.toLocaleString('id-ID')}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderOmzetView(db) {
            const totalOmzetAll = (db.transactions || []).reduce((sum, trx) => sum + trx.total, 0);
            const totalTrxCount = (db.transactions || []).length;

            return `
                <div class="space-y-6 text-slate-800">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="bg-white p-6 rounded-3xl shadow-xs border border-slate-200 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Akumulasi Omzet Keseluruhan</p>
                                <p class="text-3xl font-black text-blue-900 mt-1">Rp ${totalOmzetAll.toLocaleString('id-ID')}</p>
                            </div>
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl font-bold">
                                <i class="fa-solid fa-chart-line"></i>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-xs border border-slate-200 flex items-center justify-between">
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Total Pesanan Pancong</p>
                                <p class="text-3xl font-black text-emerald-600 mt-1">${totalTrxCount} Pesanan</p>
                            </div>
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl font-bold">
                                <i class="fa-solid fa-file-invoice-dollar"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-xs border border-slate-200 p-6 space-y-4">
                        <h3 class="font-black text-blue-950 text-lg uppercase">Rekapitulasi Omzet Pancong Lumer</h3>
                        <p class="text-sm text-slate-600">Seluruh laporan transaksi tersimpan secara aman di perangkat kasir.</p>
                    </div>
                </div>
            `;
        }

        function renderMenusView(db) {
            return `
                <div class="space-y-6 text-slate-800">
                    <div class="bg-white p-6 rounded-3xl shadow-xs border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 class="font-black text-blue-950 text-xl uppercase">Kelola Menu & Topping Pancong (CRUD)</h2>
                            <p class="text-xs text-slate-500 mt-0.5">Tambah, ubah, dan hapus varian pancong lumer</p>
                        </div>
                        <button onclick="openMenuModal('add')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-md transition flex items-center space-x-2">
                            <i class="fa-solid fa-plus"></i>
                            <span>Tambah Pancong Baru</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-3xl shadow-xs border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-blue-900 text-xs font-bold uppercase tracking-wider">
                                        <th class="p-4">Nama Varian</th>
                                        <th class="p-4">Kategori</th>
                                        <th class="p-4">Varian Topping</th>
                                        <th class="p-4">Harga</th>
                                        <th class="p-4">Stok Porsi</th>
                                        <th class="p-4 text-center">Aksi / CRUD</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${db.products.map(p => `
                                        <tr>
                                            <td class="p-4 font-bold text-slate-900">${p.name}</td>
                                            <td class="p-4"><span class="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold border border-blue-200">${p.category}</span></td>
                                            <td class="p-4 text-xs font-semibold text-slate-600">${p.topping || '-'}</td>
                                            <td class="p-4 font-semibold text-slate-900">Rp ${p.price.toLocaleString('id-ID')}</td>
                                            <td class="p-4 font-black text-blue-900">${p.stock}</td>
                                            <td class="p-4 text-center space-x-2">
                                                <button onclick="openMenuModal('edit', '${p.id}')" class="text-blue-700 hover:bg-blue-100 px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-50 transition"><i class="fa-solid fa-pen-to-square mr-1"></i> Edit</button>
                                                <button onclick="deleteMenu('${p.id}')" class="text-rose-600 hover:bg-rose-100 px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-50 transition"><i class="fa-solid fa-trash mr-1"></i> Hapus</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="menu-crud-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-xs">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 border border-blue-100 text-slate-800">
                        <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
                            <h3 id="crud-modal-title" class="font-bold text-blue-950 text-base">Tambah Pancong Baru</h3>
                            <button onclick="closeMenuModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form id="menu-crud-form" class="space-y-4" onsubmit="saveMenuData(event)">
                            <input type="hidden" id="crud-menu-id">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Nama Varian Pancong</label>
                                <input type="text" id="crud-menu-name" required placeholder="Contoh: Pancong Tiramisu Oreo" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Varian Topping</label>
                                <input type="text" id="crud-menu-topping" placeholder="Contoh: Glaze Tiramisu + Crumb Oreo" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Kategori Pancong</label>
                                <select id="crud-menu-cat" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900">
                                    <option value="Original">Original</option>
                                    <option value="Coklat">Coklat</option>
                                    <option value="Premium">Premium</option>
                                    <option value="Special">Special</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Harga (Rp)</label>
                                    <input type="number" id="crud-menu-price" required placeholder="13000" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Stok Porsi</label>
                                    <input type="number" id="crud-menu-stock" required placeholder="50" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-md transition text-sm">
                                Simpan Varian Pancong
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        window.initMenusListeners = function(db) {}

        window.saveMenuData = function(e) {
            e.preventDefault();
            const db = getDB();
            const id = document.getElementById("crud-menu-id").value;
            const name = document.getElementById("crud-menu-name").value.trim();
            const topping = document.getElementById("crud-menu-topping").value.trim();
            const category = document.getElementById("crud-menu-cat").value;
            const price = parseFloat(document.getElementById("crud-menu-price").value) || 0;
            const stock = parseInt(document.getElementById("crud-menu-stock").value) || 0;

            if (id) {
                const product = db.products.find(p => p.id === id);
                if (product) {
                    product.name = name;
                    product.topping = topping;
                    product.category = category;
                    product.price = price;
                    product.stock = stock;
                    showAlert("Menu Diperbarui", `Varian ${name} berhasil diperbarui.`, "success");
                }
            } else {
                const newProduct = { id: "p" + Date.now(), name, topping, category, price, stock };
                db.products.push(newProduct);
                showAlert("Menu Ditambahkan", `Varian ${name} berhasil ditambahkan.`, "success");
            }

            saveDB(db);
            window.closeMenuModal();
        };

        window.openMenuModal = function(mode, productId = null) {
            const db = getDB();
            const modal = document.getElementById("menu-crud-modal");
            const titleEl = document.getElementById("crud-modal-title");
            const idInput = document.getElementById("crud-menu-id");
            const nameInput = document.getElementById("crud-menu-name");
            const toppingInput = document.getElementById("crud-menu-topping");
            const catInput = document.getElementById("crud-menu-cat");
            const priceInput = document.getElementById("crud-menu-price");
            const stockInput = document.getElementById("crud-menu-stock");

            if (mode === 'edit' && productId) {
                const p = db.products.find(item => item.id === productId);
                if (p) {
                    titleEl.textContent = "Edit Varian Pancong";
                    idInput.value = p.id;
                    nameInput.value = p.name;
                    toppingInput.value = p.topping || '';
                    catInput.value = p.category;
                    priceInput.value = p.price;
                    stockInput.value = p.stock;
                }
            } else {
                titleEl.textContent = "Tambah Pancong Baru";
                idInput.value = "";
                nameInput.value = "";
                toppingInput.value = "";
                catInput.value = "Original";
                priceInput.value = "";
                stockInput.value = "";
            }

            modal.classList.remove("hidden");
        };

        window.closeMenuModal = function() {
            document.getElementById("menu-crud-modal").classList.add("hidden");
        };

        window.deleteMenu = function(productId) {
            const db = getDB();
            const product = db.products.find(p => p.id === productId);
            if (!product) return;

            db.products = db.products.filter(p => p.id !== productId);
            saveDB(db);
            showAlert("Menu Dihapus", `Varian ${product.name} telah dihapus.`, "success");
        };

        // Inisialisasi awal saat halaman dibuka
        window.addEventListener("DOMContentLoaded", () => {
            renderApp();
        });
        
        // Jalankan langsung jika DOM sudah siap
        if (document.readyState === "complete" || document.readyState === "interactive") {
            renderApp();
        }
    </script>
</body>
</html>
