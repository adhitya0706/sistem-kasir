<!DOCTYPE html>

    <script>

                { id: "rm18", name: "Box Logo", category: "Kemasan & Dus", stock: 23, unit: "pcs" },
                { id: "rm19", name: "Box Polos", category: "Kemasan & Dus", stock: 4, unit: "pcs" },
                { id: "rm20", name: "Sendok Bebek", category: "Kemasan & Dus", stock: 126, unit: "gr" },
                { id: "rm21", name: "Kresek Kecil", category: "Kemasan & Dus", stock: 115, unit: "gr" }
            ],
            products: [
                { id: "p1", name: "ORSS (Original Susu)", price: 8000, stock: 20, category: "Original", topping: "Susu" },
                { id: "p2", name: "KJSS (Keju Susu)", price: 11000, stock: 15, category: "Special", topping: "Keju Parut + SKM" },
                { id: "p3", name: "C (Cokelat)", price: 10000, stock: 12, category: "Coklat", topping: "Glaze Cokelat" },
                { id: "p4", name: "TM (Tiramisu)", price: 10000, stock: 10, category: "Premium", topping: "Glaze Tiramisu" },
                { id: "p5", name: "CKC (Choco Crunchy)", price: 12000, stock: 12, category: "Coklat", topping: "Choco Crunchy" }
            ],
            cart: [],
            transactions: [],
            submittedShiftReports: [],
            activeTab: "pos",
            selectedOutletFilter: "All"
        };

        let globalDB = JSON.parse(JSON.stringify(defaultDB));

        function getDB() {
            return globalDB;
        }

        function fetchDBFromCloud(callback) {
            database.ref("pancong_db").once("value").then((snapshot) => {
                const val = snapshot.val();
                if (val) {
                    globalDB = val;
                    if (!globalDB.submittedShiftReports) globalDB.submittedShiftReports = [];
                    if (!globalDB.transactions) globalDB.transactions = [];
                } else {
                    database.ref("pancong_db").set(defaultDB);
                    globalDB = JSON.parse(JSON.stringify(defaultDB));
                }
                if (callback) callback(globalDB);
            }).catch((err) => {
                console.error("Gagal memuat database cloud:", err);
                if (callback) callback(globalDB);
            });
        }

        function saveDB(data, callback) {
            globalDB = data;
            database.ref("pancong_db").set(data).then(() => {
                renderApp();
                if (callback) callback();
            }).catch((err) => {
                console.error("Gagal menyimpan ke cloud:", err);
            });
        }

        function showAlert(title, message, type = "info") {
            const container = document.getElementById("toast-container");
            if (!container) return;

            const toast = document.createElement("div");
            const bgClass = type === "error" ? "bg-rose-600 text-white" : type === "success" ? "bg-emerald-600 text-white" : "bg-blue-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-xmark' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} text-lg"></i>
                <div>
                    <h4 class="font-bold text-xs uppercase tracking-wider">${title}</h4>
                    <p class="text-xs font-medium opacity-90">${message}</p>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==========================================
        // LOGIN & SHIFT MODAL
        // ==========================================
        function renderLoginView(db) {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl border border-blue-100 p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg ring-4 ring-blue-100">
                                <i class="fa-solid fa-stroopwafel"></i>
                            </div>
                            <h1 class="text-2xl font-black text-blue-900 uppercase tracking-wide">PANCONG <span class="text-blue-600">LUMER</span></h1>
                            <p class="text-xs text-slate-500 font-semibold mt-1">Sistem POS Kasir & Laporan Shift</p>
                        </div>

                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Username</label>
                                <input type="text" id="login-username" required placeholder="admin / karyawan" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">PIN Akses (4 Digit)</label>
                                <input type="password" id="login-pin" maxlength="4" required placeholder="1234 / 5678" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition text-sm">
                                MASUK KE SISTEM
                            </button>
                        </form>
                        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500 space-y-1 bg-slate-50 p-3 rounded-2xl">
                            <p>Admin: <code class="bg-blue-100 text-blue-800 px-1 rounded font-bold">admin</code> / <code class="bg-blue-100 text-blue-800 px-1 rounded font-bold">1234</code></p>
                            <p>Karyawan: <code class="bg-blue-100 text-blue-800 px-1 rounded font-bold">karyawan</code> / <code class="bg-blue-100 text-blue-800 px-1 rounded font-bold">5678</code></p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById("login-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const username = document.getElementById("login-username").value.trim();
                const pin = document.getElementById("login-pin").value.trim();

                fetchDBFromCloud((freshDB) => {
                    const user = freshDB.users.find(u => u.username === username && u.pin === pin);
                    if (user) {
                        freshDB.currentUser = user;
                        saveDB(freshDB);
                    } else {
                        showAlert("Login Gagal", "Username atau PIN salah.", "error");
                    }
                });
            });
        }

        function renderShiftModal(db) {
            const appEl = document.getElementById("app");
            appEl.innerHTML = `
                <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-blue-950 to-blue-900">
                    <div class="bg-white rounded-3xl shadow-2xl border border-blue-100 p-8 max-w-md w-full text-slate-800">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3">
                                <i class="fa-solid fa-id-card-clip"></i>
                            </div>
                            <h2 class="text-xl font-black text-blue-950 uppercase">Presensi Shift Karyawan</h2>
                        </div>
                        <form id="shift-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Nama Karyawan</label>
                                <input type="text" id="shift-emp-name" required placeholder="Nama Lengkap" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-blue-900 mb-1">Outlet Pancong</label>
                                <select id="shift-outlet-name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold text-slate-900">
                                    ${db.outlets.map(o => `<option value="${o}">${o}</option>`).join('')}
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 rounded-xl shadow-lg transition text-sm">
                                Mulai Shift Kerja
                            </button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById("shift-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const empName = document.getElementById("shift-emp-name").value.trim();
                const outlet = document.getElementById("shift-outlet-name").value;
                if (!empName) return showAlert("Wajib Diisi", "Masukkan nama karyawan.", "error");

                db.currentShift = { employeeName: empName, outletName: outlet, startTime: new Date().toISOString() };
                saveDB(db);
            });
        }

        // ==========================================
        // RENDER UTAMA APLIKASI
        // ==========================================
        function renderApp() {
            const db = getDB();
            const appEl = document.getElementById("app");

            if (!db.currentUser) {
                renderLoginView(db);
                return;
            }
            if (db.currentUser.role === 'karyawan' && !db.currentShift.employeeName) {
                renderShiftModal(db);
                return;
            }

            appEl.className = "min-h-screen flex flex-col";
            appEl.innerHTML = `
                <header class="bg-blue-900 text-white sticky top-0 z-30 shadow-md">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-white text-blue-900 rounded-xl flex items-center justify-center font-bold shadow-md">
                                <i class="fa-solid fa-stroopwafel text-blue-600 text-xl"></i>
                            </div>
                            <div>
                                <h1 class="font-black text-white text-base leading-tight uppercase tracking-wider">PANCONG <span class="text-blue-300">LUMER</span></h1>
                                <p class="text-[11px] text-blue-200 font-semibold">${db.currentUser.role === 'karyawan' ? `Outlet: ${db.currentShift.outletName}` : 'Pusat Kontrol Admin'}</p>
                            </div>
                        </div>

                        <div class="flex items-center space-x-3">
                            <div class="text-right hidden sm:block">
                                <p class="text-xs font-bold text-white">${db.currentUser.role === 'karyawan' ? db.currentShift.employeeName : db.currentUser.name}</p>
                                <span class="text-[10px] uppercase font-black px-2 py-0.5 bg-blue-800 text-blue-200 rounded-full">${db.currentUser.role === 'karyawan' ? 'Staff' : 'Admin'}</span>
                            </div>
                            <button id="btn-logout" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-right-from-bracket"></i> Keluar
                            </button>
                        </div>
                    </div>
                </header>

                <nav class="bg-white border-b border-slate-200 shadow-xs">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-2 overflow-x-auto py-2.5">
                        <button onclick="switchTab('pos')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'pos' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-cash-register mr-1"></i> Kasir POS</button>
                        <button onclick="switchTab('sales')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'sales' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-receipt mr-1"></i> Penjualan Hari Ini</button>
                        <button onclick="switchTab('omzet')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'omzet' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-chart-line mr-1"></i> Omzet</button>
                        <button onclick="switchTab('stock')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'stock' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-boxes-stacked mr-1"></i> Rekap Stok</button>
                        <button onclick="switchTab('generator')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${db.activeTab === 'generator' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Generator Laporan WA</button>
                    </div>
                </nav>

                <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8"></main>

                <!-- Receipt Modal -->
                <div id="receipt-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 flex flex-col max-h-[90vh]">
                        <div class="flex justify-between items-center pb-3 border-b mb-4">
                            <h3 class="font-bold text-blue-950 text-base">Struk Thermal</h3>
                            <button onclick="closeReceiptModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="receipt-container" class="overflow-y-auto flex-1 font-mono text-xs bg-slate-50 p-4 rounded-2xl mb-4"></div>
                        <div class="flex space-x-3">
                            <button onclick="window.print()" class="flex-1 bg-blue-600 text-white font-black py-3 rounded-xl shadow-md">Cetak Struk</button>
                            <button onclick="closeReceiptModal()" class="px-4 bg-slate-100 text-slate-700 py-3 rounded-xl font-semibold">Tutup</button>
                        </div>
                    </div>
                </div>

                <!-- Checkout Modal -->
                <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 text-slate-800">
                        <div class="flex justify-between items-center pb-3 border-b mb-4">
                            <h3 id="checkout-title" class="font-bold text-blue-950 text-base">Pembayaran</h3>
                            <button onclick="closeCheckoutModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="checkout-body" class="space-y-4"></div>
                    </div>
                </div>
            `;

            document.getElementById("btn-logout").addEventListener("click", () => {
                fetchDBFromCloud((freshDB) => {
                    freshDB.currentUser = null;
                    freshDB.currentShift = { employeeName: "", outletName: "", startTime: null };
                    saveDB(freshDB);
                });
            });

            renderActiveTabContent();
        }

        window.switchTab = function(tabName) {
            fetchDBFromCloud((freshDB) => {
                freshDB.activeTab = tabName;
                saveDB(freshDB);
            });
        };

        function renderActiveTabContent() {
            const db = getDB();
            const mainEl = document.getElementById("main-content");
            if (!mainEl) return;

            if (db.activeTab === "pos") { mainEl.innerHTML = renderPOSView(db); initPOSListeners(db); }
            else if (db.activeTab === "sales") mainEl.innerHTML = renderSalesView(db);
            else if (db.activeTab === "omzet") mainEl.innerHTML = renderOmzetView(db);
            else if (db.activeTab === "stock") mainEl.innerHTML = renderStockView(db);
            else if (db.activeTab === "generator") { mainEl.innerHTML = renderGeneratorView(db); initGeneratorListeners(db); }
        }

        // ==========================================
        // 1. KASIR POS VIEW
        // ==========================================
        function renderPOSView(db) {
            const cartTotal = (db.cart || []).reduce((sum, item) => sum + (item.price * item.qty), 0);
            return `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div class="lg:col-span-8 space-y-4">
                        <div class="bg-white p-4 rounded-2xl shadow-xs border">
                            <input type="text" id="pos-search" placeholder="Cari menu pancong..." class="w-full px-4 py-2.5 bg-slate-50 border rounded-xl text-sm font-medium">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="pos-products-grid">
                            ${db.products.map(p => `
                                <div data-name="${p.name.toLowerCase()}" class="product-card bg-white rounded-2xl border p-4 shadow-xs flex flex-col justify-between">
                                    <div>
                                        <span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded-lg text-[10px] font-bold">${p.category}</span>
                                        <h3 class="font-black text-slate-900 text-base mt-2">${p.name}</h3>
                                        <p class="text-xs text-slate-500 mt-1">+ ${p.topping}</p>
                                    </div>
                                    <div class="mt-4 pt-3 border-t flex justify-between items-center">
                                        <span class="font-black text-blue-900 text-sm">Rp ${p.price.toLocaleString('id-ID')}</span>
                                        <button onclick="addToCart('${p.id}')" class="px-3 py-1.5 bg-blue-600 text-white font-bold rounded-xl text-xs">Tambah</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="lg:col-span-4">
                        <div class="bg-white rounded-3xl border p-5 shadow-lg sticky top-20 space-y-4">
                            <h2 class="font-black text-blue-950 text-base uppercase">Keranjang Pesanan</h2>
                            <div class="max-h-[300px] overflow-y-auto space-y-2">
                                ${(!db.cart || db.cart.length === 0) ? '<p class="text-xs text-slate-400 text-center py-6">Keranjang kosong</p>' : db.cart.map(item => `
                                    <div class="bg-slate-50 p-2.5 rounded-xl flex justify-between items-center text-xs">
                                        <div><strong>${item.name}</strong> x${item.qty}</div>
                                        <div class="font-bold text-blue-900">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="pt-3 border-t space-y-2">
                                <div class="flex justify-between font-black text-sm"><span>Total:</span><span>Rp ${cartTotal.toLocaleString('id-ID')}</span></div>
                                <button onclick="openPaymentModal('cash')" ${(!db.cart || db.cart.length === 0) ? 'disabled' : ''} class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs">Bayar Tunai</button>
                                <button onclick="openPaymentModal('qris')" ${(!db.cart || db.cart.length === 0) ? 'disabled' : ''} class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs">Bayar QRIS</button>
                            </div>
                        </div>
                    </div>
                </div>

        window.addToCart = function(id) {
            fetchDBFromCloud((fdb) => {

                const ex = fdb.cart.find(x => x.id === id);
                if (ex) ex.qty += 1;
                else fdb.cart.push({ id: p.id, name: p.name, price: p.price, topping: p.topping, qty: 1 });
                saveDB(fdb);
            });
        };

        window.openPaymentModal = function(method) {
            const db = getDB();
            const total = (db.cart || []).reduce((s, i) => s + (i.price * i.qty), 0);

            document.getElementById("checkout-title").textContent = method === 'cash' ? "Pembayaran Tunai" : "Pembayaran QRIS";
            document.getElementById("checkout-body").innerHTML = `
                <p class="text-sm font-bold text-center">Total: Rp ${total.toLocaleString('id-ID')}</p>

            modal.classList.remove("hidden");

        window.processCheckout = function(method) {
            fetchDBFromCloud((fdb) => {
                const total = (fdb.cart || []).reduce((s, i) => s + (i.price * i.qty), 0);
                const newTrx = {
                    id: "TRX-" + Math.floor(100000 + Math.random() * 900000),
                    date: new Date().toISOString(),
                    employeeName: fdb.currentUser.role === 'karyawan' ? fdb.currentShift.employeeName : fdb.currentUser.name,
                    outletName: fdb.currentUser.role === 'karyawan' ? fdb.currentShift.outletName : 'Outlet Pusat',
                    items: [...fdb.cart], total, paymentMethod: method
                };
                if (!fdb.transactions) fdb.transactions = [];
                fdb.transactions.unshift(newTrx);
                fdb.cart = [];
                saveDB(fdb, () => {
                    closeCheckoutModal();
                    document.getElementById("receipt-container").innerHTML = `<h2 class="font-bold text-center">PANCONG LUMER</h2><p class="text-center">${newTrx.id}</p><hr class="my-2">${newTrx.items.map(i=>`<div>${i.name} x${i.qty} - Rp${(i.price*i.qty).toLocaleString('id-ID')}</div>`).join('')}<hr class="my-2"><p class="font-bold">Total: Rp ${total.toLocaleString('id-ID')}</p>`;
